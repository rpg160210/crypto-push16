name: train
on:
  schedule:
    - cron: "41 3 * * 0"   # every Sunday - retrain on fresh data
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v5        # keeps downloaded price history between runs
        with:
          path: data
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - run: python train.py --coins ${{ vars.TRAIN_COINS || 1000 }}
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - run: |
          git config user.name "analyst-bot"
          git config user.email "analyst-bot@users.noreply.github.com"
          git add model.joblib training_report.json
          git commit -m "retrain model"
          git pull --rebase
          git push
