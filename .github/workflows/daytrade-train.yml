name: daytrade-train
on:
  schedule:
    - cron: "17 2 * * *"   # every day (backup schedule)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daytrade-train
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python daytrade.py train
      - run: |
          git config user.name "analyst-bot"
          git config user.email "analyst-bot@users.noreply.github.com"
          git add daytrade_model.joblib daytrade_report.json
          if ! git diff --cached --quiet; then
            git commit -m "retrain day-trade model"
            git pull --rebase
            git push
          fi
