name: dashboard
on:
  workflow_run:   # rebuild the page after every bot run
    workflows: [analyze, hype, train, daytrade-scan, daytrade-train]
    types: [completed]
  schedule:
    - cron: "11 17 * * 0"   # Sunday evening: makes sure the weekly summary goes out
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dashboard
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python dashboard.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: https://rpg160210.github.io/crypto-push16/
      - run: |
          git config user.name "analyst-bot"
          git config user.email "analyst-bot@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "update dashboard"
            git pull --rebase
            git push
          fi
